name: Security Scan

on:
  push:
    branches:
      - '*'

permissions:
  contents: read
  security-events: write

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install bandit bandit-sarif-formatter

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          limit-severities-for-sarif: false

      - name: Upload Trivy SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Run Bandit (Sarif)
        run: |
          bandit -r . --format sarif --output bandit-results.sarif || true

      - name: Upload Bandit SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.sarif 

      - name: Start Django development server
        run: |
          if [ -f manage.py ]; then
            python manage.py migrate 
            python manage.py runserver &
            sleep 10
          else
            echo "manage.py não encontrado, pulando start do servidor."
          fi
        env:
          SECRET_KEY: ${{ secrets.DJANGO_PROD_SECRET_KEY }}

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://127.0.0.1:8000"
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          sarif_output: zaproxy.sarif
        continue-on-error: true

      - name: Upload ZAP SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: zaproxy.sarif

      - name: Stop Django development server
        run: |
          pkill -f "python manage.py runserver" || true
